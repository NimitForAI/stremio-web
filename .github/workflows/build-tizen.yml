name: Build Tizen WGT

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "fix/**"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-tizen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # webpack.config.js runs `git rev-parse HEAD`

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web bundle and package Tizen WGT
        run: npm run package:tizen

      - name: Locate the generated .wgt
        id: wgt
        run: |
          file="$(ls -1 *.wgt | head -n1)"
          echo "Found: $file"
          echo "path=$file" >> "$GITHUB_OUTPUT"

      - name: Upload .wgt as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: stremio-tizen-wgt
          path: "*.wgt"
          if-no-files-found: error
          retention-days: 30

      - name: Attach .wgt to the Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.wgt.outputs.path }}
